name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # «Compilación» en Ajustes › Acerca de: el commit de la rama, no el de fusión del PR.
      CLARA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/, retention-days: 7 }
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [celular, celular-pequeno, escritorio]
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }} --workers=2 --fail-on-flaky-tests
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Entre comillas: `${{ }}` dentro de un mapa `{ }` no es YAML válido.
          name: 'playwright-${{ matrix.project }}'
          path: test-results/
          retention-days: 7
